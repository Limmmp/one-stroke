<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Один росчерк</title>
<style>
  html,body{margin:0;height:100%;background:#0b0e18;overflow:hidden;
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #wrap{position:relative;transform-origin:center center}
  canvas{display:block;border-radius:14px;touch-action:none}
  .btn{position:absolute;display:flex;align-items:center;justify-content:center;gap:9px;
    border:0;border-radius:999px;color:#fff;cursor:pointer;white-space:nowrap;
    font:600 18px/1 system-ui,sans-serif;box-shadow:0 6px 20px rgba(0,0,0,.35)}
  /* display:flex перебивает display:none из атрибута hidden — возвращаем явно */
  .btn[hidden]{display:none}
  .btn svg{width:20px;height:20px;flex:none}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.4;cursor:default}
  #btn-undo{left:38px;bottom:96px;padding:14px 26px;background:#3a4468}
  #btn-hint{right:38px;bottom:96px;padding:14px 26px;background:#3a4468}
  #btn-reset{left:50%;transform:translateX(-50%);bottom:38px;padding:12px 30px;background:#2b3252}
  #btn-reset:active{transform:translateX(-50%) scale(.96)}
  #btn-next{left:50%;transform:translateX(-50%);bottom:66px;padding:16px 44px;background:#4a8cff;font-size:20px}
  #btn-next:active{transform:translateX(-50%) scale(.96)}
</style>
</head>
<body>
  <div id="stage">
    <div id="wrap">
      <canvas id="game"></canvas>

      <button class="btn" id="btn-undo" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 7H15a5 5 0 0 1 0 10h-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M11.5 3.5 7 7l4.5 3.5z" fill="currentColor"/>
        </svg>
        Отменить
      </button>

      <button class="btn" id="btn-hint" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3a6 6 0 0 0-3.5 10.9V17h7v-3.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M10 20h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        Подсказка
      </button>

      <button class="btn" id="btn-reset" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 4.5a7.5 7.5 0 1 0 7.2 9.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
          <path d="M12 1.4v6.2l4-3.1z" fill="currentColor"/>
        </svg>
        Заново
      </button>

      <button class="btn" id="btn-next" hidden>
        Дальше
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M5 12h12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
